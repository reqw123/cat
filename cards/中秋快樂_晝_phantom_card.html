<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>中秋快樂·晝 — SSR 幻影殘卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  @property --holo-ang { syntax:'<angle>'; inherits:true; initial-value:108deg; }

  :root{
    --c1:#b28324;
    --c2:#39a3ef;
    --c3:#92d0fc;
    --abyss:#16130b;
    --frame:6px;
    --card-w: clamp(272px, min(86vw, 58vh), 372px);
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  img{ -webkit-user-drag:none; user-select:none; -webkit-user-select:none; }
  html,body{ height:100%; }
  body{
    background:radial-gradient(130% 120% at 50% -10%, #2f2818 0%, #221c11 38%, #16120b 72%, #0a0805 100%);
    color:#eef5f2;
    font-family:'Noto Sans TC', system-ui, -apple-system, "Microsoft JhengHei", "PingFang TC", sans-serif;
    display:grid; place-items:center; overflow:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    touch-action:none;
  }
  .card, .card *{
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  body::before{
    content:""; position:fixed; inset:-20%;
    background:
      radial-gradient(2px 2px at 20% 30%, rgba(240,186,76,0.5), transparent 60%),
      radial-gradient(2px 2px at 78% 22%, rgba(57,163,239,0.45), transparent 60%),
      radial-gradient(1.5px 1.5px at 62% 68%, rgba(255,255,255,.25), transparent 60%),
      radial-gradient(1.5px 1.5px at 33% 82%, rgba(57,163,239,0.35), transparent 60%);
    filter:blur(.3px);
    animation:floatDust 22s ease-in-out infinite alternate; pointer-events:none;
  }
  @keyframes floatDust{ to{ transform:translate3d(2%,-3%,0) rotate(3deg); } }

  .stage{
    perspective:1300px;
    perspective-origin:50% 42%;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:60px 22px 26px;
  }

  /* ==================== 卡牌容器：自由 3D 軸（拖曳環轉，非單純懸停傾斜） ==================== */
  .card{
    position:relative;
    width:var(--card-w);
    aspect-ratio:100 / 140;
    transform-style: preserve-3d;
    transform: rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    will-change: transform;
    cursor: grab;
    touch-action:none;
  }
  .card.dragging{ cursor: grabbing; }
  .card.snapping{ transition: transform .5s cubic-bezier(.2,.8,.2,1); }

  .card__front, .card__back{
    position:absolute; inset:0;
    border-radius:20px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    transform-style:preserve-3d;
  }
  .card__back{ transform: rotateY(180deg) translateZ(.5px); }

  /* spinning 時剝除濾鏡/動畫，避免高速旋轉時合成器卡頓或視覺瑕疵 */
  .card.dragging .card__frame,
  .card.dragging .holo,
  .card.dragging .subject,
  .card.dragging .holo__dust{ filter:none !important; animation-play-state:paused !important; }

  /* ---------- 動態金屬外框 ---------- */
  .card__frame{
    position:absolute; inset:0;
    border-radius:inherit;
    padding:var(--frame);
    background:linear-gradient(115deg, #241a05 0%, #8a6a1c 9%, #d8b352 19%, #fff6d8 27%, #b98d2e 35%, #5c4610 47%, #9a7a24 58%, #f4e2a0 70%, #7c5f18 84%, #241a05 100%);
    background-size:280% 280%;
    animation: sheen 7s linear infinite;
    filter:
      brightness(var(--sheen,1)) saturate(1.06)
      drop-shadow(0 34px 48px rgba(0,0,0,.62))
      drop-shadow(0 9px 18px rgba(0,0,0,.55));
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.30),
      inset 0 0 16px rgba(0,0,0,.55),
      0 0 22px rgba(212,175,55,.16);
  }
  @keyframes sheen{ from{ background-position:0% 50%; } to{ background-position:280% 50%; } }

  .card__inner{
    position:relative; height:100%;
    border-radius:14px; overflow:hidden;
    isolation:isolate;
    background:radial-gradient(120% 78% at 50% -6%, #2f2818 0%, var(--abyss) 52%, #0b0905 100%);
    box-shadow: inset 0 0 0 1px rgba(57,163,239,0.22), inset 0 0 46px rgba(0,0,0,.72);
  }

  /* ==================== 場景窗 ==================== */
  /* 邊緣柔化遮罩：讓照片內容（尤其色彩對比強的主體區塊）自然融進 card__inner 的環境色，
     不會在金屬外框內側看起來像「另外貼了一張矩形照片」 */
  .scene{
    position:absolute; left:0; right:0; top:0; height:60%; overflow:hidden; z-index:1;
    -webkit-mask-image: radial-gradient(115% 95% at 50% 32%, #000 62%, transparent 100%);
    mask-image: radial-gradient(115% 95% at 50% 32%, #000 62%, transparent 100%);
  }
  .scene img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover;
    transition: transform .16s ease-out;
    will-change: transform;
    backface-visibility:hidden;
    object-position:50% 50%;
  }
  .scene__bg{ z-index:1; filter: blur(0.6px) brightness(1.2) saturate(1.18) contrast(1.06); transform: scale(1.14); }
  .ghost--warn{
    z-index:2; opacity:.18; mix-blend-mode:screen;
    filter:sepia(1) hue-rotate(167deg) saturate(3.4) brightness(.95) contrast(1.1) drop-shadow(0 0 10px rgba(51,170,255,0.7));
    transform: translate(11%, -16%) scale(1.16);
  }
  .ghost--past{
    z-index:3; opacity:.15; mix-blend-mode:screen;
    filter:sepia(1) hue-rotate(2deg) saturate(3.6) brightness(.9) contrast(1.08) blur(.6px) drop-shadow(0 0 10px rgba(255,187,51,0.7));
    transform: translate(-26%, 16%) scale(1.24);
  }
  .scene__veil{ position:absolute; inset:0; z-index:4; pointer-events:none; background:radial-gradient(130% 90% at 50% 20%, rgba(240,186,76,0.12), rgba(25,20,11,0.24) 60%, rgba(18,14,8,0.4) 100%); }
  .scene__mist{
    position:absolute; inset:0; z-index:5; pointer-events:none;
    box-shadow: inset 0 -46px 40px var(--abyss), inset 0 24px 26px rgba(0,0,0,.42), inset 0 0 0 1px rgba(0,0,0,.3);
    background:linear-gradient(180deg, var(--abyss) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 52%, rgba(28,23,13,0.72) 82%, var(--abyss) 100%);
  }

  /* ==================== 全息膜 ==================== */
  .holo{
    position:absolute; inset:0; z-index:6; pointer-events:none;
    mix-blend-mode: color-dodge;
    opacity:.3;
    -webkit-mask-image: linear-gradient(180deg, #000 0 52%, rgba(0,0,0,.22) 64%, rgba(0,0,0,.14) 100%);
    mask-image: linear-gradient(180deg, #000 0 52%, rgba(0,0,0,.22) 64%, rgba(0,0,0,.14) 100%);
  }
  .holo__spectrum{
    position:absolute; inset:0;
    background:
      radial-gradient(38% 30% at var(--gx,50%) var(--gy,50%), rgba(255,255,255,.14), rgba(255,255,255,0) 70%),
      linear-gradient(var(--holo-ang,108deg), rgba(146,208,252,0.42) 0%, rgba(246,194,90,0.42) 22%, rgba(56,169,250,0.42) 42%, rgba(186,247,100,0.42) 64%, rgba(56,250,201,0.42) 82%, rgba(146,208,252,0.42) 100%);
    background-size:200% 200%, 320% 320%;
    background-position:0 0, var(--sweep,50%) 50%;
    filter:saturate(1.35) contrast(1.04);
  }
  
  .holo__dust{
    position:absolute; inset:-25%;
    background-image:
      radial-gradient(rgba(255,255,255,.95) .6px, transparent 1.4px),
      radial-gradient(rgba(112,195,255,0.85) .7px, transparent 1.6px),
      radial-gradient(rgba(240,186,76,0.8) .6px, transparent 1.4px);
    background-size:17px 17px, 26px 26px, 39px 41px;
    background-position:0 0, 8px 11px, 19px 4px;
    transform: translate(var(--dx,0px), var(--dy,0px));
    animation: dustDrift 12s linear infinite;
    opacity:.5;
  }
  @keyframes dustDrift{
    from{ background-position:0 0, 8px 11px, 19px 4px; }
    to  { background-position:34px -46px, -30px 37px, 52px 44px; }
  }

  /* ==================== 頂部標記：不透明漸層，永遠可讀，不用 backdrop-filter ==================== */
  .topbar{
    position:absolute; top:15px; left:15px; right:15px; z-index:21;
    transform: translateZ(66px);
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
  }
  .chip{
    font-family:'Cinzel','Noto Sans TC',serif; font-weight:700;
    font-size:11px; letter-spacing:.16em; padding:5px 10px 4px;
    border-radius:8px; border:1px solid rgba(255,255,255,.28);
    text-shadow:0 1px 2px #000;
  }
  .chip--elem{
    color:#fef6e7;
    background:linear-gradient(120deg, rgba(178,131,36,0.62), rgba(57,163,239,0.5));
    box-shadow:0 0 14px rgba(240,186,76,0.4), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .chip--ssr{
    color:#2a1a00; letter-spacing:.26em;
    background:linear-gradient(120deg,#ffe9a8,#d4af37 55%,#a97d1e);
    border-color:rgba(255,246,214,.65);
    box-shadow:0 0 16px rgba(212,175,55,.55), inset 0 1px 0 rgba(255,255,255,.6);
  }

  /* ==================== 技能面板 ==================== */
  .panel{
    position:absolute; left:0; right:0; bottom:0;
    height:46%; z-index:2;
    padding:14px 17px 16px;
    display:flex; flex-direction:column; gap:8px;
    background:rgba(25,20,11,0.85);
    border-top:1px solid rgba(224,194,133,0.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 -18px 40px rgba(0,0,0,.42);
  }
  .eyebrow{
    font-family:'Cinzel',serif; font-weight:700; letter-spacing:.32em;
    font-size:10.5px; color:#a8d8fa;
    text-shadow:0 0 12px rgba(57,163,239,0.6), 0 1px 2px #000;
  }
  .name{
    font-family:'Cinzel','Noto Sans TC',serif; font-weight:900;
    font-size:30px; line-height:1; color:#fbfbf9; letter-spacing:.05em;
    text-shadow:0 0 18px rgba(240,186,76,0.42), 0 2px 5px #000;
  }
  .name::after{
    content:""; display:block; margin-top:7px; height:1px; width:100%;
    background:linear-gradient(90deg, rgba(240,186,76,0.7), rgba(57,163,239,0.35) 45%, transparent);
  }
  .skill{ position:relative; padding-left:12px; margin-top:1px; }
  .skill::before{
    content:""; position:absolute; left:0; top:1px; bottom:3px;
    width:3px; border-radius:2px;
    background:linear-gradient(180deg, var(--c1), rgba(255,255,255,.05));
    box-shadow:0 0 10px var(--c1);
  }
  .skill__name{
    font-family:'Cinzel','Noto Sans TC',serif; font-weight:700; font-size:15px;
    color:#edc982; text-shadow:0 0 12px rgba(240,186,76,0.55), 0 1px 2px #000;
  }
  .skill__name span{
    font-family:'Noto Sans TC',sans-serif; font-weight:500; font-size:10.5px;
    color:#a2bbcd; letter-spacing:.1em; margin-left:4px;
  }
  .skill__desc{
    margin-top:4px; font-size:11.5px; line-height:1.6; color:#e9f1ee;
    text-shadow:0 1px 3px #000, 0 0 7px rgba(0,0,0,.7);
  }
  .skill__desc b{ color:#fff; font-weight:700; text-shadow:0 0 8px rgba(146,208,252,0.7), 0 1px 2px #000; }

  /* ==================== 主體：剪裁在卡面內，真實小幅 translateZ 景深 ==================== */
  .subject{
    position:absolute;
    left:50%; bottom:46%;
    width:60%;
    z-index:20;
    pointer-events:none;
    transform:
      translate(-50%, 0)
      translate3d(var(--sx,0px), var(--sy,0px), 26px)
      rotateX(var(--srx,0deg)) rotateY(var(--sry,0deg))
      scale(var(--sscale,1));
    transition: transform .1s ease-out;
    filter:
      drop-shadow(0 26px 20px rgba(0,0,0,.6))
      drop-shadow(0 10px 10px rgba(0,0,0,.45))
      drop-shadow(0 0 18px rgba(255,214,140,.45))
      contrast(1.08) saturate(1.1) brightness(1.02);
  }
  .subject img{ display:block; width:100%; height:auto; }

  /* ==================== 卡背（顏色全部由 --c1/--c2/--c3 推導，不需要額外 token） ==================== */
  .back__frame{
    position:absolute; inset:0; border-radius:20px; padding:var(--frame);
    background:linear-gradient(115deg, #241a05 0%, #8a6a1c 9%, #d8b352 19%, #fff6d8 27%, #b98d2e 35%, #5c4610 47%, #9a7a24 58%, #f4e2a0 70%, #7c5f18 84%, #241a05 100%); background-size:280% 280%; animation: sheen 7s linear infinite;
    filter: brightness(var(--sheen,1)) saturate(1.06) drop-shadow(0 34px 48px rgba(0,0,0,.62)) drop-shadow(0 9px 18px rgba(0,0,0,.55));
    box-shadow: inset 0 0 0 1px rgba(255,244,210,.42), inset 0 0 16px rgba(0,0,0,.55), 0 0 22px rgba(212,175,55,.14);
  }
  .back__inner{
    position:relative; height:100%; border-radius:14px; overflow:hidden;
    background:radial-gradient(120% 100% at 50% 30%, color-mix(in srgb, var(--c1) 22%, var(--abyss)) 0%, var(--abyss) 62%, #030508 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c2) 26%, transparent), inset 0 0 46px rgba(0,0,0,.8);
  }
  .back__lattice{
    position:absolute; inset:0; opacity:.5;
    background-image:
      repeating-linear-gradient(45deg, color-mix(in srgb, var(--c2) 35%, transparent) 0 1.5px, transparent 1.5px 26px),
      repeating-linear-gradient(-45deg, color-mix(in srgb, var(--c2) 35%, transparent) 0 1.5px, transparent 1.5px 26px);
  }
  .back__emblem{
    position:relative; width:74%; aspect-ratio:1; border-radius:50%;
    background:radial-gradient(closest-side, color-mix(in srgb, var(--c1) 30%, #05070b), #04060a);
    border:2px solid color-mix(in srgb, var(--c2) 60%, transparent);
    box-shadow:0 0 30px color-mix(in srgb, var(--c1) 40%, transparent), inset 0 0 24px rgba(0,0,0,.5);
    display:grid; place-items:center;
  }
  .back__glyph{
    font-family:'Cinzel','Noto Sans TC',serif; font-weight:900; font-size:calc(var(--card-w) * 0.36);
    color:var(--c3); text-shadow:0 0 22px var(--c1), 0 0 6px var(--c2); line-height:1;
  }
  .back__setname{
    position:absolute; bottom:9%; left:0; right:0; text-align:center;
    font-family:'Cinzel',serif; font-weight:700; font-size:10px; letter-spacing:.3em;
    color:var(--c3); text-shadow:0 0 10px var(--c2), 0 1px 2px #000;
  }
  .back__mark{
    position:absolute; top:4%; left:0; right:0; text-align:center;
    font-family:'Cinzel',serif; font-weight:700; font-size:9.5px; letter-spacing:.34em;
    color:rgba(255,255,255,.55);
  }
  .back__medallion{ position:relative; width:60%; aspect-ratio:1; display:grid; place-items:center; }
  .back__ring{
    position:absolute; inset:-7%; border-radius:50%;
    background:
      repeating-conic-gradient(from 0deg, var(--c2) 0deg 3deg, transparent 3deg 15deg),
      radial-gradient(closest-side, transparent 78%, rgba(255,255,255,.06) 79% 100%);
    -webkit-mask: radial-gradient(closest-side, transparent 0 82%, #000 85% 92%, transparent 95%);
    mask: radial-gradient(closest-side, transparent 0 82%, #000 85% 92%, transparent 95%);
    opacity:.7; filter: drop-shadow(0 0 8px var(--c2));
    animation: ringspin 46s linear infinite;
  }
  .back__ring::after{ content:""; position:absolute; inset:9%; border-radius:50%; border:1px solid rgba(255,255,255,.18); }
  @keyframes ringspin{ to{ transform:rotate(360deg); } }
  .back__skill{
    position:relative; margin-top:4px;
    font-family:'Cinzel',serif; font-weight:700; font-size:9px; letter-spacing:.2em;
    color:var(--c3); text-transform:uppercase; text-align:center;
    text-shadow:0 0 10px var(--c2), 0 1px 2px #000; opacity:.85;
  }
  .back__meta{ position:relative; display:flex; align-items:center; gap:8px; margin-top:8px; }
  .back__meta .chip{ font-size:9.5px; padding:4px 8px 3px; }
  .back__id{
    position:relative; margin-top:6px; text-align:center;
    font-family:'Cinzel','Noto Sans TC',serif; font-weight:600; font-size:9px;
    letter-spacing:.16em; color:rgba(255,255,255,.5); text-shadow:0 1px 2px #000;
  }
  .back__corner{ position:absolute; width:20px; height:20px; pointer-events:none; border:2px solid var(--c2); opacity:.5; }
  .back__corner--tl{ top:6%; left:5%; border-right:none; border-bottom:none; border-radius:5px 0 0 0; }
  .back__corner--tr{ top:6%; right:5%; border-left:none; border-bottom:none; border-radius:0 5px 0 0; }
  .back__corner--bl{ bottom:6%; left:5%; border-right:none; border-top:none; border-radius:0 0 0 5px; }
  .back__corner--br{ bottom:6%; right:5%; border-left:none; border-top:none; border-radius:0 0 5px 0; }
  .back__sheen{
    position:absolute; inset:0; pointer-events:none; mix-blend-mode:overlay; opacity:.55;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.6) 47%, transparent 64%);
    background-size:280% 280%; animation: sheen 7s linear infinite;
  }

  .hint{ font-size:11px; letter-spacing:.14em; color:rgba(230,240,236,.5); text-shadow:0 1px 3px #000; text-align:center; }

  @media (prefers-reduced-motion: reduce){
    .card__frame, .holo__dust, body::before{ animation:none !important; }
    .card, .subject{ transition:none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card" id="card">
      <div class="card__front">
        <div class="card__frame">

    holo.style.setProperty('--dy', (oy*-16).toFixed(1)+'px');

    holo.style.setProperty('--fy', oy.toFixed(3));

      typeof DeviceOrientationEvent.requestPermission === 'function'){

  }

  /* ------------------------------------------------------------------ 音效（WebAudio 合成，不需要任何外部檔案） */
  var AC = window.AudioContext || window.webkitAudioContext;
  var actx = null, master = null, nbuf = null;
  function isMuted() { return lsGet('muted') === '1'; }
  function audio() {
    if (isMuted() || !AC) return null;
    if (!actx) {
      try {
        actx = new AC();
        master = actx.createGain(); master.gain.value = 0.34;
        var comp = actx.createDynamicsCompressor();
        master.connect(comp); comp.connect(actx.destination);
      } catch (e) { actx = null; return null; }
    }
    if (actx.state === 'suspended') { try { actx.resume(); } catch (e) { /* 需要使用者手勢 */ } }
    return actx;
  }
  function noiseBuffer() {
    if (nbuf) return nbuf;
    nbuf = actx.createBuffer(1, actx.sampleRate * 1.2, actx.sampleRate);
    var d = nbuf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return nbuf;
  }
  function tone(freq, t, dur, type, peak, slideTo) {
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + Math.min(0.02, dur / 4));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, ftype, f0, f1, peak, attack) {
    var s = actx.createBufferSource(); s.buffer = noiseBuffer();
    var f = actx.createBiquadFilter(); f.type = ftype;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    f.Q.value = ftype === 'bandpass' ? 1.4 : 0.7;
    var g = actx.createGain(); var a = attack || 0.02;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  var SFX = {
    flip: function (t) { noise(t, 0.3, 'bandpass', 500, 2800, 0.55); tone(190, t, 0.2, 'sine', 0.22, 90); },
    rarity: function (t) {
      var n = { SR: 2, SSR: 3, UR: 4, LR: 5 }[rarity] || 3;
      var sc = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      for (var i = 0; i < n; i++) { tone(sc[i], t + i * 0.075, 0.55, 'triangle', 0.2); tone(sc[i] * 2, t + i * 0.075, 0.4, 'sine', 0.06); }
      noise(t, 0.55, 'highpass', 6000, 9500, 0.05);
    },
    charge: function (t) {
      var o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain(), lfo = actx.createOscillator(), lg = actx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(440, t + 0.75);
      f.type = 'lowpass'; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3200, t + 0.75);
      lfo.frequency.value = 14; lg.gain.value = 0.04; lfo.connect(lg); lg.connect(g.gain);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
      o.connect(f); f.connect(g); g.connect(master);
      o.start(t); lfo.start(t); o.stop(t + 0.85); lfo.stop(t + 0.85);
      noise(t, 0.75, 'lowpass', 200, 4200, 0.16, 0.5);
    },
    burst: function (t) {
      tone(170, t, 0.6, 'sine', 0.7, 36);
      tone(95, t, 0.9, 'sawtooth', 0.16, 48);
      noise(t, 0.5, 'lowpass', 5200, 260, 0.62, 0.008);
      for (var i = 0; i < 9; i++) tone(1800 + Math.random() * 4200, t + 0.03 + Math.random() * 0.4, 0.14, 'sine', 0.07);
    }
  };
  function sfx(name, opts) {
    if (opts && opts.sound === false) return;
    var c = audio(); if (!c) return;
    try { SFX[name](c.currentTime + 0.01); } catch (e) { /* 音效壞了不該影響卡片 */ }
  }

  /* ------------------------------------------------------------------ 稀有度 */
  var rarity = 'SSR';
  function applyRarity(r, opts) {
    if (TIERS.indexOf(r) < 0) r = 'SSR';
    rarity = r;
    document.body.setAttribute('data-rarity', r);
    var chips = document.querySelectorAll('.chip--ssr');
    for (var i = 0; i < chips.length; i++) chips[i].textContent = r;
    var slots = document.querySelectorAll('[data-fx-rarity]');
    for (var j = 0; j < slots.length; j++) slots[j].textContent = r;
    if (opts && opts.save !== false) lsSet(id + ':rarity', r);
    if (opts && opts.fx) {
      faces.forEach(function (f) {
        if (f.shine.animate) f.shine.animate([{ opacity: 0.9, transform: 'translateX(-130%)' }, { opacity: 0.9, transform: 'translateX(130%)' }], { duration: 750, easing: 'ease-in-out' });
      });
      toast('✦ ' + r);
      sfx('rarity', opts);
    }
  }
  function cycleRarity(opts) {
    var o = opts || {};
    applyRarity(TIERS[(TIERS.indexOf(rarity) + 1) % TIERS.length], { fx: true, sound: o.sound });
  }
  var saved = lsGet(id + ':rarity');
  applyRarity(TIERS.indexOf(saved) >= 0 ? saved : (TIERS.indexOf(meta.rarity) >= 0 ? meta.rarity : 'SSR'), { save: false });

  /* ------------------------------------------------------------------ 靜音 */
  function setMuted(m) {
    lsSet('muted', m ? '1' : '0');
    toast(m ? '🔇 音效靜音' : '🔊 音效開啟');
    if (!m) sfx('rarity');
  }
  function toggleMute() { setMuted(!isMuted()); }

  /* ------------------------------------------------------------------ 卡背資訊 */
  (function buildInfo() {
    var back = card.querySelector('.back__inner');
    if (!back || !meta.stats) return;
    var info = document.createElement('div');
    info.className = 'back__info';
    var head = '<div class="bi-head"><span>NO. <b>' + (meta.no || '000') + '</b></span>' +
      '<span>收藏 <b>' + (meta.date || '') + '</b></span></div>';
    var stats = '<div class="bi-stats">';
    ['ATK', 'DEF', 'SPD', 'LUK'].concat(Object.keys(meta.stats)).filter(function (k, i, a) { return a.indexOf(k) === i && meta.stats[k] != null; }).forEach(function (k) {
      var v = clamp(+meta.stats[k] || 0, 0, 100);
      stats += '<div class="bi-stat"><span>' + k + '</span><div class="bi-bar"><i style="width:' + v + '%"></i></div><em>' + v + '</em></div>';
    });
    stats += '</div>';
    var date = '';
    info.innerHTML = head + stats + date;
    var anchor = back.querySelector('.back__id');
    // 六狗系列原本的卡背編號「NO. 03 / 06」是系列內編號，會跟這裡的全系列編號打架 → 改成只顯示名稱
    if (anchor && /NO\.\s*\d+\s*\/\s*\d+/.test(anchor.textContent) && meta.name) anchor.textContent = meta.name;
    if (anchor) back.insertBefore(info, anchor); else back.appendChild(info);
    back.classList.add('has-fx-info');
  })();

  /* ------------------------------------------------------------------ 技能演出 */
  var casting = false;
  var CHARGE = 750, BURST_DUR = 950;
  function cast(opts) {
    if (casting) return;
    casting = true;
    var o = opts || {};
    var sizeBase = faces[0] ? faces[0] : null;
    var W = sizeBase ? sizeBase.host.clientWidth : card.clientWidth;
    var H = sizeBase ? sizeBase.host.clientHeight : card.clientHeight;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    faces.forEach(function (f) {
      f.cv.width = Math.round(W * dpr); f.cv.height = Math.round(H * dpr);
      f.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    });
    var cx = W / 2, cy = H * 0.46;
    var parts = [];
    var cols = [colors[0], colors[1], colors[2], '#ffffff'];
    var t0 = performance.now(), last = t0, burst = false, spawnAcc = 0;
    document.body.classList.add('fx-charging');
    sfx('charge', o);
    toast('⚡ ' + (meta.skillName || 'SKILL'));

    function doBurst() {
      burst = true;
      sfx('burst', o);
      document.body.classList.remove('fx-charging');
      document.body.classList.add('fx-burst');
      parts.length = 0;
      for (var i = 0; i < 130; i++) {
        var a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 9;
        parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.012 + Math.random() * 0.02,
          size: 1.2 + Math.random() * 3, color: cols[i % cols.length], fr: 0.965, mode: 'out' });
      }
      faces.forEach(function (f) {
        if (f.flash.animate) f.flash.animate([{ opacity: 0 }, { opacity: 1, offset: 0.16 }, { opacity: 0 }], { duration: 560, easing: 'ease-out' });
        if (f.ring.animate) {
          f.ring.animate([{ transform: 'translate(-50%,-50%) scale(0)', opacity: 0.95 }, { transform: 'translate(-50%,-50%) scale(30)', opacity: 0 }], { duration: 850, easing: 'cubic-bezier(.1,.7,.2,1)' });
          f.ring.animate([{ transform: 'translate(-50%,-50%) scale(0)', opacity: 0.7 }, { transform: 'translate(-50%,-50%) scale(20)', opacity: 0 }], { duration: 700, delay: 130, easing: 'cubic-bezier(.1,.7,.2,1)', fill: 'backwards' });
        }
      });
      // 殘影加倍：把場景裡的殘影層各複製一份，往兩側飄開再淡出
      var srcs = document.querySelectorAll('.ghost--warn, .ghost--past, .echo');
      Array.prototype.forEach.call(srcs, function (el, k) {
        if (!el.animate || !el.parentNode || el.classList.contains('fx-clone')) return;
        var cl = el.cloneNode(true);
        cl.removeAttribute('id');
        cl.classList.add('fx-clone');
        var base = getComputedStyle(el).transform; if (base === 'none') base = '';
        var dir = k % 2 ? 1 : -1;
        el.parentNode.insertBefore(cl, el.nextSibling);
        var an = cl.animate([
          { transform: base + ' translate(0%,0%) scale(1)', opacity: 0 },
          { transform: base + ' translate(' + (dir * 9) + '%,' + (-4 * dir) + '%) scale(1.06)', opacity: 0.85, offset: 0.25 },
          { transform: base + ' translate(' + (dir * 30) + '%,' + (10 * dir) + '%) scale(1.16)', opacity: 0 }
        ], { duration: 1150, easing: 'ease-out' });
        an.onfinish = function () { if (cl.parentNode) cl.parentNode.removeChild(cl); };
      });
    }

    function frame(now) {
      var dt = Math.min(48, now - last); last = now;
      var t = now - t0, shx = 0, shy = 0, aura = 0, scale = 1;
      if (t < CHARGE) {
        var k = t / CHARGE, e = k * k;
        aura = e; scale = 1 - 0.035 * e;
        var amp = 0.3 + 1.7 * e; shx = (Math.random() - 0.5) * amp; shy = (Math.random() - 0.5) * amp;
        spawnAcc += dt * (0.09 + 0.16 * k);
        while (spawnAcc >= 1) {
          spawnAcc -= 1;
          var a = Math.random() * Math.PI * 2, r = Math.max(W, H) * (0.55 + Math.random() * 0.2);
          parts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * 0.85, life: 1, decay: 0.006, size: 1 + Math.random() * 2.4,
            color: cols[(Math.random() * cols.length) | 0], mode: 'in', sw: (Math.random() - 0.5) * 0.06 });
        }
      } else {
        if (!burst) doBurst();
        var b = clamp((t - CHARGE) / BURST_DUR, 0, 1);
        aura = 1 - b;
        var amp2 = 10 * Math.pow(1 - b, 2); shx = (Math.random() - 0.5) * amp2; shy = (Math.random() - 0.5) * amp2;
        scale = 1 + 0.07 * Math.pow(1 - b, 2) * Math.cos(b * 13);
      }
      root.style.setProperty('--fx-aura', aura.toFixed(3));
      root.style.setProperty('--fx-scale', scale.toFixed(4));
      root.style.setProperty('--fx-shx', shx.toFixed(2) + 'px');
      root.style.setProperty('--fx-shy', shy.toFixed(2) + 'px');

      // 粒子
      for (var i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];
        if (p.mode === 'in') {
          var dx = cx - p.x, dy = cy - p.y;
          p.x += dx * 0.075 - dy * p.sw; p.y += dy * 0.075 + dx * p.sw;
          if (dx * dx + dy * dy < 100) { parts.splice(i, 1); continue; }
        } else {
          p.x += p.vx; p.y += p.vy; p.vx *= p.fr; p.vy *= p.fr; p.life -= p.decay;
          if (p.life <= 0) { parts.splice(i, 1); continue; }
        }
      }
      faces.forEach(function (f) {
        var c = f.ctx;
        c.clearRect(0, 0, W, H);
        c.globalCompositeOperation = 'lighter';
        if (!burst) {                      // 中央能量核心
          var kk = clamp(t / CHARGE, 0, 1), rr = 6 + 46 * kk * kk;
          var gr = c.createRadialGradient(cx, cy, 0, cx, cy, rr);
          gr.addColorStop(0, 'rgba(255,255,255,' + (0.35 + 0.6 * kk) + ')'); gr.addColorStop(0.4, colors[1]); gr.addColorStop(1, 'rgba(0,0,0,0)');
          c.globalAlpha = 0.25 + 0.6 * kk; c.fillStyle = gr; c.beginPath(); c.arc(cx, cy, rr, 0, 6.2832); c.fill();
        }
        for (var j = 0; j < parts.length; j++) {
          var q = parts[j];
          c.globalAlpha = q.mode === 'in' ? 0.85 : clamp(q.life, 0, 1);
          c.fillStyle = q.color;
          c.beginPath(); c.arc(q.x, q.y, q.size * (q.mode === 'in' ? 1 : (0.5 + q.life * 0.7)), 0, 6.2832); c.fill();
        }
        c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
      });

      if (t < CHARGE + BURST_DUR + 250) { requestAnimationFrame(frame); return; }
      // 收尾
      root.style.removeProperty('--fx-aura'); root.style.removeProperty('--fx-scale');
      root.style.removeProperty('--fx-shx'); root.style.removeProperty('--fx-shy');
      document.body.classList.remove('fx-charging', 'fx-burst');
      faces.forEach(function (f) { f.ctx.clearRect(0, 0, W, H); });
      casting = false;
    }
    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ 觸發：點擊 / 按鍵 */
  var down = null, clickTimer = null;
  card.addEventListener('pointerdown', function (e) { if (e.button === 0) down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  window.addEventListener('pointerup', function (e) {
    if (!down) return;
    var d = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
    down = null;
    if (e.button !== 0 || d > 5 || dt > 350) return;          // 拖曳旋轉不算點擊
    clearTimeout(clickTimer);
    clickTimer = setTimeout(function () { cast(); }, 260);    // 等一下：如果是雙擊（翻面）就取消
  });
  card.addEventListener('dblclick', function () { clearTimeout(clickTimer); sfx('flip'); });
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.altKey || e.metaKey || e.repeat) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var k = (e.key || '').toLowerCase();
    if (k === 'r') cycleRarity(); else if (k === 's') cast(); else if (k === 'm') toggleMute();
  });

  window.cardFx = {
    cast: cast, cycleRarity: cycleRarity, setRarity: function (r, o) { applyRarity(r, { fx: true, sound: o && o.sound }); },
    rarity: function () { return rarity; }, toggleMute: toggleMute, setMuted: setMuted, isMuted: isMuted, sfx: sfx, meta: meta,
    audioState: function () { return actx ? actx.state : 'none'; }
  };
})();
</script>
<!--CARD-FX:END-->
</body>
</html>
