<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>露天影院·夜 — SSR 幻影殘卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  @property --holo-ang { syntax:'<angle>'; inherits:true; initial-value:108deg; }

  :root{
    --c1:#336fa3;
    --c2:#efb239;
    --c3:#fcd992;
    --abyss:#0b1116;
    --frame:6px;
    --card-w: clamp(272px, min(86vw, 58vh), 372px);
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  img{ -webkit-user-drag:none; user-select:none; -webkit-user-select:none; }
  html,body{ height:100%; }
  body{
    background:radial-gradient(130% 120% at 50% -10%, #18242f 0%, #111a22 38%, #0b1116 72%, #05080a 100%);
    color:#eef5f2;
    font-family:'Noto Sans TC', system-ui, -apple-system, "Microsoft JhengHei", "PingFang TC", sans-serif;
    display:grid; place-items:center; overflow:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    touch-action:none;
  }
  .card, .card *{
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  body::before{
    content:""; position:fixed; inset:-20%;
    background:
      radial-gradient(2px 2px at 20% 30%, rgba(76,164,240,0.5), transparent 60%),
      radial-gradient(2px 2px at 78% 22%, rgba(239,178,57,0.45), transparent 60%),
      radial-gradient(1.5px 1.5px at 62% 68%, rgba(255,255,255,.25), transparent 60%),
      radial-gradient(1.5px 1.5px at 33% 82%, rgba(239,178,57,0.35), transparent 60%);
    filter:blur(.3px);
    animation:floatDust 22s ease-in-out infinite alternate; pointer-events:none;
  }
  @keyframes floatDust{ to{ transform:translate3d(2%,-3%,0) rotate(3deg); } }

  .stage{
    perspective:1300px;
    perspective-origin:50% 42%;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:60px 22px 26px;
  }

  /* ==================== 卡牌容器：自由 3D 軸（拖曳環轉，非單純懸停傾斜） ==================== */
  .card{
    position:relative;
    width:var(--card-w);
    aspect-ratio:100 / 140;
    transform-style: preserve-3d;
    transform: rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    will-change: transform;
    cursor: grab;
    touch-action:none;
  }
  .card.dragging{ cursor: grabbing; }
  .card.snapping{ transition: transform .5s cubic-bezier(.2,.8,.2,1); }

  .card__front, .card__back{
    position:absolute; inset:0;
    border-radius:20px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    transform-style:preserve-3d;
  }
  .card__back{ transform: rotateY(180deg) translateZ(.5px); }

  /* spinning 時剝除濾鏡/動畫，避免高速旋轉時合成器卡頓或視覺瑕疵 */
  .card.dragging .card__frame,
  .card.dragging .holo,
  .card.dragging .subject,
  .card.dragging .holo__dust{ filter:none !important; animation-play-state:paused !important; }

  /* ---------- 動態金屬外框 ---------- */
  .card__frame{
    position:absolute; inset:0;
    border-radius:inherit;
    padding:var(--frame);
    background:linear-gradient(115deg, #241a05 0%, #8a6a1c 9%, #d8b352 19%, #fff6d8 27%, #b98d2e 35%, #5c4610 47%, #9a7a24 58%, #f4e2a0 70%, #7c5f18 84%, #241a05 100%);
    background-size:280% 280%;
    animation: sheen 7s linear infinite;
    filter:
      brightness(var(--sheen,1)) saturate(1.06)
      drop-shadow(0 34px 48px rgba(0,0,0,.62))
      drop-shadow(0 9px 18px rgba(0,0,0,.55));
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.30),
      inset 0 0 16px rgba(0,0,0,.55),
      0 0 22px rgba(212,175,55,.16);
  }
  @keyframes sheen{ from{ background-position:0% 50%; } to{ background-position:280% 50%; } }

  .card__inner{
    position:relative; height:100%;
    border-radius:14px; overflow:hidden;
    isolation:isolate;
    background:radial-gradient(120% 78% at 50% -6%, #18242f 0%, var(--abyss) 52%, #05080b 100%);
    box-shadow: inset 0 0 0 1px rgba(239,178,57,0.22), inset 0 0 46px rgba(0,0,0,.72);
  }

  /* ==================== 場景窗 ==================== */
  /* 邊緣柔化遮罩：讓照片內容（尤其色彩對比強的主體區塊）自然融進 card__inner 的環境色，
     不會在金屬外框內側看起來像「另外貼了一張矩形照片」 */
  .scene{
    position:absolute; left:0; right:0; top:0; height:60%; overflow:hidden; z-index:1;
    -webkit-mask-image: radial-gradient(115% 95% at 50% 32%, #000 62%, transparent 100%);
    mask-image: radial-gradient(115% 95% at 50% 32%, #000 62%, transparent 100%);
  }
  .scene img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover;
    transition: transform .16s ease-out;
    will-change: transform;
    backface-visibility:hidden;
    object-position:50% 50%;
  }
  .scene__bg{ z-index:1; filter: blur(0.8px) brightness(1.12) saturate(1.1) contrast(1.06); transform: scale(1.14); }
  .ghost--warn{
    z-index:2; opacity:.3; mix-blend-mode:screen;
    filter:sepia(1) hue-rotate(2deg) saturate(3.4) brightness(.95) contrast(1.1) drop-shadow(0 0 10px rgba(255,187,51,0.7));
    transform: translate(11%, -16%) scale(1.16);
  }
  .ghost--past{
    z-index:3; opacity:.26; mix-blend-mode:screen;
    filter:sepia(1) hue-rotate(170deg) saturate(3.6) brightness(.9) contrast(1.08) blur(.6px) drop-shadow(0 0 10px rgba(51,160,255,0.7));
    transform: translate(-26%, 16%) scale(1.24);
  }
  .scene__veil{ position:absolute; inset:0; z-index:4; pointer-events:none; background:radial-gradient(130% 90% at 50% 20%, rgba(76,164,240,0.12), rgba(11,18,25,0.24) 60%, rgba(8,13,18,0.4) 100%); }
  .scene__mist{
    position:absolute; inset:0; z-index:5; pointer-events:none;
    box-shadow: inset 0 -46px 40px var(--abyss), inset 0 24px 26px rgba(0,0,0,.42), inset 0 0 0 1px rgba(0,0,0,.3);
    background:linear-gradient(180deg, var(--abyss) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 52%, rgba(13,21,28,0.72) 82%, var(--abyss) 100%);
  }

  /* ==================== 全息膜 ==================== */
  .holo{
    position:absolute; inset:0; z-index:6; pointer-events:none;
    mix-blend-mode: color-dodge;
    opacity:.3;
    -webkit-mask-image: linear-gradient(180deg, #000 0 52%, rgba(0,0,0,.22) 64%, rgba(0,0,0,.14) 100%);
    mask-image: linear-gradient(180deg, #000 0 52%, rgba(0,0,0,.22) 64%, rgba(0,0,0,.14) 100%);
  }
  .holo__spectrum{
    position:absolute; inset:0;
    background:
      radial-gradient(38% 30% at var(--gx,50%) var(--gy,50%), rgba(255,255,255,.14), rgba(255,255,255,0) 70%),
      linear-gradient(var(--holo-ang,108deg), rgba(252,217,146,0.42) 0%, rgba(90,174,246,0.42) 22%, rgba(250,185,56,0.42) 42%, rgba(132,100,247,0.42) 64%, rgba(250,56,56,0.42) 82%, rgba(252,217,146,0.42) 100%);
    background-size:200% 200%, 320% 320%;
    background-position:0 0, var(--sweep,50%) 50%;
    filter:saturate(1.35) contrast(1.04);
  }
  
  .holo__grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.16) 1px, transparent 1px),
      radial-gradient(18% 14% at 22% 28%, rgba(255,255,255,.55), transparent 70%),
      radial-gradient(14% 11% at 76% 66%, rgba(255,255,255,.4), transparent 70%);
    background-size:24px 24px, 24px 24px, 100% 100%, 100% 100%;
    mix-blend-mode:overlay;
    animation: gridDrift 8s linear infinite;
    opacity:.62;
  }
  @keyframes gridDrift{ from{ background-position:0 0,0 0,0 0,0 0; } to{ background-position:24px 24px,24px 24px,0 0,0 0; } }

  /* ==================== 頂部標記：不透明漸層，永遠可讀，不用 backdrop-filter ==================== */
  .topbar{
    position:absolute; top:15px; left:15px; right:15px; z-index:21;
    transform: translateZ(66px);
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
  }
  .chip{
    font-family:'Cinzel','Noto Sans TC',serif; font-weight:700;
    font-size:11px; letter-spacing:.16em; padding:5px 10px 4px;
    border-radius:8px; border:1px solid rgba(255,255,255,.28);
    text-shadow:0 1px 2px #000;
  }
  .chip--elem{
    color:#e7f3fe;
    background:linear-gradient(120deg, rgba(51,111,163,0.62), rgba(239,178,57,0.5));
    box-shadow:0 0 14px rgba(76,164,240,0.4), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .chip--ssr{
    color:#2a1a00; letter-spacing:.26em;
    background:linear-gradient(120deg,#ffe9a8,#d4af37 55%,#a97d1e);
    border-color:rgba(255,246,214,.65);
    box-shadow:0 0 16px rgba(212,175,55,.55), inset 0 1px 0 rgba(255,255,255,.6);
  }

  /* ==================== 技能面板 ==================== */
  .panel{
    position:absolute; left:0; right:0; bottom:0;
    height:46%; z-index:2;
    padding:14px 17px 16px;
    display:flex; flex-direction:column; gap:8px;
    background:rgba(11,18,25,0.85);
    border-top:1px solid rgba(133,182,224,0.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 -18px 40px rgba(0,0,0,.42);
  }
  .eyebrow{
    font-family:'Cinzel',serif; font-weight:700; letter-spacing:.32em;
    font-size:10.5px; color:#fadfa8;
    text-shadow:0 0 12px rgba(239,178,57,0.6), 0 1px 2px #000;
  }
  .name{
    font-family:'Cinzel','Noto Sans TC',serif; font-weight:900;
    font-size:30px; line-height:1; color:#fbfbf9; letter-spacing:.05em;
    text-shadow:0 0 18px rgba(76,164,240,0.42), 0 2px 5px #000;
  }
  .name::after{
    content:""; display:block; margin-top:7px; height:1px; width:100%;
    background:linear-gradient(90deg, rgba(76,164,240,0.7), rgba(239,178,57,0.35) 45%, transparent);
  }
  .skill{ position:relative; padding-left:12px; margin-top:1px; }
  .skill::before{
    content:""; position:absolute; left:0; top:1px; bottom:3px;
    width:3px; border-radius:2px;
    background:linear-gradient(180deg, var(--c1), rgba(255,255,255,.05));
    box-shadow:0 0 10px var(--c1);
  }
  .skill__name{
    font-family:'Cinzel','Noto Sans TC',serif; font-weight:700; font-size:15px;
    color:#82bbed; text-shadow:0 0 12px rgba(76,164,240,0.55), 0 1px 2px #000;
  }
  .skill__name span{
    font-family:'Noto Sans TC',sans-serif; font-weight:500; font-size:10.5px;
    color:#cdbfa2; letter-spacing:.1em; margin-left:4px;
  }
  .skill__desc{
    margin-top:4px; font-size:11.5px; line-height:1.6; color:#e9f1ee;
    text-shadow:0 1px 3px #000, 0 0 7px rgba(0,0,0,.7);
  }
  .skill__desc b{ color:#fff; font-weight:700; text-shadow:0 0 8px rgba(252,217,146,0.7), 0 1px 2px #000; }

  /* ==================== 主體：剪裁在卡面內，真實小幅 translateZ 景深 ==================== */
  .subject{
    position:absolute;
    left:50%; bottom:46%;
    width:92%;
    z-index:20;
    pointer-events:none;
    transform:
      translate(-50%, 0)
      translate3d(var(--sx,0px), var(--sy,0px), 26px)
      rotateX(var(--srx,0deg)) rotateY(var(--sry,0deg))
      scale(var(--sscale,1));
    transition: transform .1s ease-out;
    filter:
      drop-shadow(0 26px 20px rgba(0,0,0,.6))
      drop-shadow(0 10px 10px rgba(0,0,0,.45))
      drop-shadow(0 0 18px rgba(150,200,255,.5))
      contrast(1.08) saturate(1.1) brightness(1.02);
  }
  .subject img{ display:block; width:100%; height:auto; }

  /* ==================== 卡背（顏色全部由 --c1/--c2/--c3 推導，不需要額外 token） ==================== */
  .back__frame{
    position:absolute; inset:0; border-radius:20px; padding:var(--frame);
    background:linear-gradient(115deg, #241a05 0%, #8a6a1c 9%, #d8b352 19%, #fff6d8 27%, #b98d2e 35%, #5c4610 47%, #9a7a24 58%, #f4e2a0 70%, #7c5f18 84%, #241a05 100%); background-size:280% 280%; animation: sheen 7s linear infinite;
    filter: brightness(var(--sheen,1)) saturate(1.06) drop-shadow(0 34px 48px rgba(0,0,0,.62)) drop-shadow(0 9px 18px rgba(0,0,0,.55));
    box-shadow: inset 0 0 0 1px rgba(255,244,210,.42), inset 0 0 16px rgba(0,0,0,.55), 0 0 22px rgba(212,175,55,.14);
  }
  .back__inner{
    position:relative; height:100%; border-radius:14px; overflow:hidden;
    background:radial-gradient(120% 100% at 50% 30%, color-mix(in srgb, var(--c1) 22%, var(--abyss)) 0%, var(--abyss) 62%, #030508 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c2) 26%, transparent), inset 0 0 46px rgba(0,0,0,.8);
  }
  .back__lattice{
    position:absolute; inset:0; opacity:.5;
    background-image:
      repeating-linear-gradient(45deg, color-mix(in srgb, var(--c2) 35%, transparent) 0 1.5px, transparent 1.5px 26px),
      repeating-linear-gradient(-45deg, color-mix(in srgb, var(--c2) 35%, transparent) 0 1.5px, transparent 1.5px 26px);
  }
  .back__emblem{
    position:relative; width:74%; aspect-ratio:1; border-radius:50%;
    background:radial-gradient(closest-side, color-mix(in srgb, var(--c1) 30%, #05070b), #04060a);
    border:2px solid color-mix(in srgb, var(--c2) 60%, transparent);
    box-shadow:0 0 30px color-mix(in srgb, var(--c1) 40%, transparent), inset 0 0 24px rgba(0,0,0,.5);
    display:grid; place-items:center;
  }
  .back__glyph{
    font-family:'Cinzel','Noto Sans TC',serif; font-weight:900; font-size:calc(var(--card-w) * 0.36);
    color:var(--c3); text-shadow:0 0 22px var(--c1), 0 0 6px var(--c2); line-height:1;
  }
  .back__setname{
    position:absolute; bottom:9%; left:0; right:0; text-align:center;
    font-family:'Cinzel',serif; font-weight:700; font-size:10px; letter-spacing:.3em;
    color:var(--c3); text-shadow:0 0 10px var(--c2), 0 1px 2px #000;
  }
  .back__mark{
    position:absolute; top:4%; left:0; right:0; text-align:center;
    font-family:'Cinzel',serif; font-weight:700; font-size:9.5px; letter-spacing:.34em;
    color:rgba(255,255,255,.55);
  }
  .back__medallion{ position:relative; width:60%; aspect-ratio:1; display:grid; place-items:center; }
  .back__ring{
    position:absolute; inset:-7%; border-radius:50%;
    background:
      repeating-conic-gradient(from 0deg, var(--c2) 0deg 3deg, transparent 3deg 15deg),
      radial-gradient(closest-side, transparent 78%, rgba(255,255,255,.06) 79% 100%);
    -webkit-mask: radial-gradient(closest-side, transparent 0 82%, #000 85% 92%, transparent 95%);
    mask: radial-gradient(closest-side, transparent 0 82%, #000 85% 92%, transparent 95%);
    opacity:.7; filter: drop-shadow(0 0 8px var(--c2));
    animation: ringspin 46s linear infinite;
  }
  .back__ring::after{ content:""; position:absolute; inset:9%; border-radius:50%; border:1px solid rgba(255,255,255,.18); }
  @keyframes ringspin{ to{ transform:rotate(360deg); } }
  .back__skill{
    position:relative; margin-top:4px;
    font-family:'Cinzel',serif; font-weight:700; font-size:9px; letter-spacing:.2em;
    color:var(--c3); text-transform:uppercase; text-align:center;
    text-shadow:0 0 10px var(--c2), 0 1px 2px #000; opacity:.85;
  }
  .back__meta{ position:relative; display:flex; align-items:center; gap:8px; margin-top:8px; }
  .back__meta .chip{ font-size:9.5px; padding:4px 8px 3px; }
  .back__id{
    position:relative; margin-top:6px; text-align:center;
    font-family:'Cinzel','Noto Sans TC',serif; font-weight:600; font-size:9px;
    letter-spacing:.16em; color:rgba(255,255,255,.5); text-shadow:0 1px 2px #000;
  }
  .back__corner{ position:absolute; width:20px; height:20px; pointer-events:none; border:2px solid var(--c2); opacity:.5; }
  .back__corner--tl{ top:6%; left:5%; border-right:none; border-bottom:none; border-radius:5px 0 0 0; }
  .back__corner--tr{ top:6%; right:5%; border-left:none; border-bottom:none; border-radius:0 5px 0 0; }
  .back__corner--bl{ bottom:6%; left:5%; border-right:none; border-top:none; border-radius:0 0 0 5px; }
  .back__corner--br{ bottom:6%; right:5%; border-left:none; border-top:none; border-radius:0 0 5px 0; }
  .back__sheen{
    position:absolute; inset:0; pointer-events:none; mix-blend-mode:overlay; opacity:.55;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.6) 47%, transparent 64%);
    background-size:280% 280%; animation: sheen 7s linear infinite;
  }

  .hint{ font-size:11px; letter-spacing:.14em; color:rgba(230,240,236,.5); text-shadow:0 1px 3px #000; text-align:center; }

  @media (prefers-reduced-motion: reduce){
    .card__frame, .holo__dust, body::before{ animation:none !important; }
    .card, .subject{ transition:none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card" id="card">
      <div class="card__front">
        <div class="card__frame">

<script>
(function(){
  "use strict";
  var card    = document.getElementById('card');
  var subject = document.getElementById('subject');
  var pastG   = document.querySelector('.ghost--past');
  var warnG   = document.querySelector('.ghost--warn');
  var bg      = document.querySelector('.scene__bg');
  var holo    = document.getElementById('holo');
  var spectrum= holo.querySelector('.holo__spectrum');

  var HOVER_MAX = 40;     // 懸停傾斜（未拖曳時）
  var PITCH_MAX = 42;     // 拖曳時俯仰角上限（--ry 偏航角不設上限，可自由 360 環轉）
  var DRAG_SENS = 0.5;
  var FRICTION  = 0.94;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var orbit = { rx:0, ry:0 };     // 拖曳/慣性/翻面累積的持久旋轉
  var hover = { ox:0, oy:0 };     // 懸停時的暫態視差（放手即回零）
  var vel   = { rx:0, ry:0 };
  var dragging = false, settling = false;
  var last = { x:0, y:0, t:0 };
  var start = performance.now();

  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function wrap180(d){ d = d % 360; if (d > 180) d -= 360; if (d < -180) d += 360; return d; }

  function onPointerDown(e){
    stopAutoFlip();
    dragging = true; settling = false;
    card.classList.add('dragging'); card.classList.remove('snapping');
    last.x = e.clientX; last.y = e.clientY; last.t = performance.now();
    vel.rx = 0; vel.ry = 0;
    try{ card.setPointerCapture(e.pointerId); }catch(_){}
  }
  function onPointerMove(e){
    var r = card.getBoundingClientRect();
    var nx = (e.clientX - r.left) / r.width;
    var ny = (e.clientY - r.top ) / r.height;
    var ox = clamp(nx*2-1, -1, 1), oy = clamp(ny*2-1, -1, 1);

    if (dragging){
      var dx = e.clientX - last.x, dy = e.clientY - last.y;
      var dt = Math.max(1, performance.now() - last.t);
      var dRy = dx * DRAG_SENS, dRx = clamp(-dy * DRAG_SENS, -8, 8);
      orbit.ry += dRy;
      orbit.rx = clamp(orbit.rx + dRx, -PITCH_MAX, PITCH_MAX);
      vel.ry = dRy / dt * 16;
      vel.rx = dRx / dt * 16;
      last.x = e.clientX; last.y = e.clientY; last.t = performance.now();
    } else {
      hover.ox = ox; hover.oy = oy;
    }
    updateParallaxTargets(ox, oy);
  }
  function onPointerUp(){
    if (!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    settling = true;
    requestAnimationFrame(inertiaStep);
    startAutoFlip();
  }
  function onPointerLeave(){
    hover.ox = 0; hover.oy = 0;
  }

  function inertiaStep(){
    orbit.ry += vel.ry;
    orbit.rx = clamp(orbit.rx + vel.rx, -PITCH_MAX, PITCH_MAX);
    vel.ry *= FRICTION; vel.rx *= FRICTION;
    if (Math.abs(vel.ry) > 0.02 || Math.abs(vel.rx) > 0.02){
      requestAnimationFrame(inertiaStep);
    } else {
      snapToFace();
    }
  }
  function snapToFace(){
    settling = false;
    card.classList.add('snapping');
    orbit.ry = Math.round(orbit.ry/180)*180;
    orbit.rx = 0;
    setTimeout(function(){ card.classList.remove('snapping'); }, 520);
  }
  function flip(){
    card.classList.add('snapping');
    orbit.ry = Math.round(orbit.ry/180)*180 + 180;
    orbit.rx = 0;
    setTimeout(function(){ card.classList.remove('snapping'); }, 520);
  }

  var AUTO_FLIP_MS = 1000;
  var autoFlipOn = false;    // 使用者是否已用快捷鍵開啟此模式（預設關閉，卡片維持靜止）
  var autoFlipTimer = null;  // 實際跑的計時器（拖曳中會暫停，但不影響 autoFlipOn）
  function startAutoFlip(){
    if (autoFlipTimer || !autoFlipOn) return; // 不看 reduce：這是使用者按快捷鍵主動開啟的模式
    autoFlipTimer = setInterval(function(){
      if (!dragging && !settling) flip();
    }, AUTO_FLIP_MS);
  }
  function stopAutoFlip(){
    if (!autoFlipTimer) return;
    clearInterval(autoFlipTimer);
    autoFlipTimer = null;
  }
  function toggleAutoFlip(){
    autoFlipOn = !autoFlipOn;
    if (autoFlipOn) startAutoFlip(); else stopAutoFlip();
  }
  // 讓桌面掛件外殼（main.js 的 INJECTED_SCRIPT，跟這段卡片腳本同一個
  // window/主世界）能從外部呼叫，藉此把 AUTOFLIP_KEY 全域快捷鍵轉發進來——
  // 卡片單獨用瀏覽器打開時完全不受影響，這個屬性平常沒人讀也沒差。
  window.toggleAutoFlip = toggleAutoFlip;
  window.addEventListener('keydown', function(e){
    if (e.key === 'l' || e.key === 'L') toggleAutoFlip();
  });

  card.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove, { passive:true });
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
  card.addEventListener('pointerleave', onPointerLeave);
  card.addEventListener('dblclick', flip);
  window.addEventListener('blur', onPointerUp);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) onPointerUp(); });

  window.addEventListener('deviceorientation', function(e){
    if (dragging || e.gamma==null || e.beta==null) return;
    hover.ox = clamp(e.gamma/28, -1, 1);
    hover.oy = clamp((e.beta-42)/28, -1, 1);
    updateParallaxTargets(0.5+hover.ox/2, 0.5+hover.oy/2);
  }, true);

  var px = { gx:50, gy:50, mag:0 };
  function updateParallaxTargets(nx, ny){
    px.gx = clamp(nx*100,0,100); px.gy = clamp(ny*100,0,100);
    px.mag = Math.min(1, Math.hypot(nx*2-1, ny*2-1));
  }

  function frame(t){
    if (!dragging && !settling && !reduce){
      var s = (t-start)/1000;
      if (Math.hypot(hover.ox,hover.oy) < 0.02){
        hover.ox = Math.sin(s*0.7)*0.28; hover.oy = Math.cos(s*0.52)*0.2;
      }
    }
    var faceRy = wrap180(orbit.ry);
    var fx = clamp(faceRy/90, -1, 1);
    var fy = clamp(orbit.rx/PITCH_MAX, -1, 1);
    var hx = dragging ? 0 : hover.ox;
    var hy = dragging ? 0 : hover.oy;

    var finalRx = orbit.rx + hy*HOVER_MAX*0.35;
    var finalRy = orbit.ry + hx*HOVER_MAX*0.55;

    card.style.setProperty('--rx', finalRx.toFixed(2)+'deg');
    card.style.setProperty('--ry', finalRy.toFixed(2)+'deg');

    var mag = Math.min(1, Math.hypot(fx,fy) + Math.hypot(hx,hy)*0.4);
    card.style.setProperty('--sheen', (1 + mag*0.55).toFixed(3));

    var ox = clamp(fx + hx*0.5, -1, 1), oy = clamp(fy + hy*0.5, -1, 1);
    var bx = -ox, by = -oy;

    subject.style.setProperty('--sx', (ox * 8).toFixed(1)+'px');
    subject.style.setProperty('--sy', (oy * 6 - mag*2).toFixed(1)+'px');
    subject.style.setProperty('--srx', (-by*4).toFixed(2)+'deg');
    subject.style.setProperty('--sry', (bx*4).toFixed(2)+'deg');
    subject.style.setProperty('--sscale', (1 + mag*0.02).toFixed(3));

    bg.style.transform    = 'scale(1.14) translate(' + (bx*7).toFixed(1) + 'px,' + (by*6).toFixed(1) + 'px)';
    warnG.style.transform = 'translate(calc(11% + '  + (bx*34).toFixed(1) + 'px), calc(-16% + ' + (by*30).toFixed(1) + 'px)) scale(1.16)';
    pastG.style.transform = 'translate(calc(-26% + '  + (bx*58).toFixed(1) + 'px), calc(16% + ' + (by*52).toFixed(1) + 'px)) scale(1.24)';

    var ang = Math.atan2(oy, ox)*180/Math.PI + 108;
    spectrum.style.setProperty('--holo-ang', ang.toFixed(1)+'deg');
    spectrum.style.setProperty('--gx', (50+ox*50).toFixed(1)+'%');
    spectrum.style.setProperty('--gy', (50+oy*50).toFixed(1)+'%');
    spectrum.style.setProperty('--sweep', (50 + ox*55).toFixed(1)+'%');
    holo.style.opacity = (0.14 + mag*0.30).toFixed(3);
    holo.style.setProperty('--dx', (ox*-16).toFixed(1)+'px');
    holo.style.setProperty('--dy', (oy*-16).toFixed(1)+'px');
    holo.style.setProperty('--fx', ox.toFixed(3));
    holo.style.setProperty('--fy', oy.toFixed(3));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function'){
    var ask = function(){ DeviceOrientationEvent.requestPermission().catch(function(){}); window.removeEventListener('click', ask); };
    window.addEventListener('click', ask);
  }
})();
</script>

/* ====================================================================

   由 card-fx/apply_fx.py 連同 fx.js、#card-meta 一起注入每張卡片；不要直接改卡片裡的副本，
   改這份再重新執行 apply_fx.py。
   ==================================================================== */

/* ---------- 共用色（fx.js 依 #card-meta.colors 寫入 :root） ---------- */
:root{ --fx-c1:#8be9fd; --fx-c2:#bd93f9; --fx-c3:#ffffff; --fx-aura:0; }

/* 蓄力縮放／爆發震動：用獨立的 scale / translate 屬性，不會蓋掉卡片自己的 transform（3D 傾斜、CARD_SCALE） */
.card{ scale:var(--fx-scale,1); }
.stage{ translate:var(--fx-shx,0px) var(--fx-shy,0px); }

/* ---------- 特效層（每個面一份，蓋在卡面內、被圓角裁切） ---------- */
.fx-layer{ position:absolute; inset:0; z-index:30; pointer-events:none; overflow:hidden; border-radius:inherit; }
.fx-canvas{ position:absolute; inset:0; width:100%; height:100%; }
.fx-flash{ position:absolute; inset:0; opacity:0; mix-blend-mode:screen;
  background:radial-gradient(circle at 50% 46%, #fff 0%, var(--fx-c3) 18%, var(--fx-c2) 40%, transparent 72%); }
.fx-ring{ position:absolute; left:50%; top:46%; width:22px; height:22px; border-radius:50%; opacity:0;
  border:3px solid var(--fx-c3); box-shadow:0 0 18px var(--fx-c2), inset 0 0 12px var(--fx-c2);
  transform:translate(-50%,-50%) scale(0); }
.fx-shine{ position:absolute; inset:-25%; opacity:0; mix-blend-mode:screen;
  background:linear-gradient(105deg, transparent 38%, rgba(255,255,255,.85) 50%, transparent 62%); transform:translateX(-130%); }
.fx-toast{ position:absolute; left:50%; top:9%; transform:translateX(-50%); opacity:0; white-space:nowrap;
  padding:5px 13px 4px; border-radius:999px; font:700 11px/1.2 'Cinzel','Noto Sans TC',sans-serif; letter-spacing:.16em; color:#fff;
  background:rgba(8,10,16,.82); border:1px solid var(--fx-c2); box-shadow:0 0 14px var(--fx-c2); text-shadow:0 1px 2px #000; }

/* ---------- 星光（SR 少 → LR 滿，依稀有度顯示前 N 顆） ---------- */
.fx-stars{ position:absolute; inset:0; }
.fx-stars i{ position:absolute; font-style:normal; line-height:1; color:#fff; opacity:.65;
  text-shadow:0 0 6px var(--fx-c3), 0 0 13px var(--fx-c2);
  animation:fxTwinkle var(--d,3s) ease-in-out var(--dl,0s) infinite; }
@keyframes fxTwinkle{ 0%,100%{ opacity:.12; transform:scale(.55) rotate(0deg); } 50%{ opacity:1; transform:scale(1.15) rotate(18deg); } }
body[data-rarity="SR"]  .fx-stars i:nth-child(n+11),
body[data-rarity="SSR"] .fx-stars i:nth-child(n+25),
body[data-rarity="UR"]  .fx-stars i:nth-child(n+49){ display:none; }

/* ---------- 稜鏡層（UR / LR 才有） ---------- */
.fx-prism{ position:absolute; inset:0; opacity:var(--rar-prism,0); mix-blend-mode:color-dodge;
  background:linear-gradient(115deg, rgba(255,0,140,.55), rgba(255,214,0,.55) 25%, rgba(0,255,170,.55) 50%, rgba(0,160,255,.55) 75%, rgba(160,80,255,.55));
  animation:fxPrism 9s linear infinite; }
/* 用 hue-rotate 循環變色（不用移動放大的漸層——平鋪的接縫會在卡面上出現硬邊） */
@keyframes fxPrism{ from{ filter:hue-rotate(0deg); } to{ filter:hue-rotate(360deg); } }

/* ---------- 稀有度：每一階一組變數 ---------- */
body{ --rar-sat:1; --rar-br:1; --rar-prism:0; --rar-glow:rgba(212,175,55,.16); --rar-glow-r:22px;
  --rar-frame:linear-gradient(115deg,#241a05 0%,#8a6a1c 9%,#d8b352 19%,#fff6d8 27%,#b98d2e 35%,#5c4610 47%,#9a7a24 58%,#f4e2a0 70%,#7c5f18 84%,#241a05 100%); }
body[data-rarity="SR"]{ --rar-sat:.72; --rar-br:.82; --rar-prism:0; --rar-glow:rgba(190,208,230,.30); --rar-glow-r:18px;
  --rar-frame:linear-gradient(115deg,#1a2029 0%,#566171 9%,#a9b6c7 19%,#f1f6fb 27%,#8d99aa 35%,#434d5b 47%,#7a8798 58%,#dde7f1 70%,#58626f 84%,#1a2029 100%); }
body[data-rarity="SSR"]{ --rar-sat:1; --rar-br:1; --rar-prism:0; --rar-glow:rgba(212,175,55,.34); --rar-glow-r:26px; }
body[data-rarity="UR"]{ --rar-sat:1.5; --rar-br:1.22; --rar-prism:.30; --rar-glow:rgba(190,120,255,.52); --rar-glow-r:34px;
  --rar-frame:linear-gradient(115deg,#2a0f3a 0%,#ff4fa3 11%,#ffd24f 22%,#5dffb1 34%,#4fb8ff 46%,#a26bff 58%,#ff4fa3 70%,#ffd24f 82%,#2a0f3a 100%); }
body[data-rarity="LR"]{ --rar-sat:1.8; --rar-br:1.4; --rar-prism:.46; --rar-glow:rgba(255,190,225,.62); --rar-glow-r:42px;
  --rar-frame:linear-gradient(115deg,#2b1a20 0%,#e8b4c8 9%,#ffffff 20%,#f6d27a 31%,#c69ad6 43%,#ffffff 55%,#9fd8ff 66%,#e8b4c8 77%,#f6d27a 88%,#2b1a20 100%); }

/* 邊框金屬感：只換 background-image（不用簡寫、不加 !important 到 position），卡片原本的 sheen 流光動畫照常跑；
   光暈同時疊上技能蓄力的 --fx-aura。 */
body[data-rarity] .card__frame, body[data-rarity] .back__frame{ background-image:var(--rar-frame) !important; }
body[data-rarity] .card__frame, body[data-rarity] .back__frame{
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.38), inset 0 0 16px rgba(0,0,0,.55),
    0 0 var(--rar-glow-r,22px) var(--rar-glow,rgba(212,175,55,.16)),
    0 0 calc(8px + 40px*var(--fx-aura,0)) calc(1px + 9px*var(--fx-aura,0)) color-mix(in srgb, var(--fx-c2) calc(var(--fx-aura,0)*90%), transparent) !important; }
/* 全息材質強度 */
body[data-rarity] .holo{ filter:saturate(var(--rar-sat,1)) brightness(var(--rar-br,1)); }

/* 稀有度晶片：每一階自己的材質 */
body[data-rarity="SR"] .chip--ssr{ color:#101820 !important; background:linear-gradient(120deg,#f6f9fc,#aab7c8 55%,#7d8b9d) !important;
  border-color:rgba(255,255,255,.7) !important; box-shadow:0 0 14px rgba(190,208,230,.55), inset 0 1px 0 rgba(255,255,255,.7) !important; }
body[data-rarity="UR"] .chip--ssr{ color:#fff !important; text-shadow:0 1px 2px rgba(0,0,0,.7);
  background:linear-gradient(120deg,#ff4fa3,#ffb84f 30%,#5dffb1 55%,#4fb8ff 78%,#a26bff) !important;
  border-color:rgba(255,255,255,.75) !important; box-shadow:0 0 18px rgba(190,120,255,.7), inset 0 1px 0 rgba(255,255,255,.6) !important; }
body[data-rarity="LR"] .chip--ssr{ color:#3a1030 !important;
  background:linear-gradient(120deg,#fff,#f6d27a 30%,#e8b4c8 55%,#9fd8ff 80%,#fff) !important;
  border-color:rgba(255,255,255,.9) !important; box-shadow:0 0 22px rgba(255,190,225,.85), inset 0 1px 0 rgba(255,255,255,.9) !important; }

/* ---------- 技能演出：爆發瞬間 ---------- */
body.fx-burst .holo{ opacity:.85 !important; filter:saturate(1.7) brightness(1.3) !important; }
body.fx-burst .ghost--warn, body.fx-burst .ghost--past, body.fx-burst .echo{ opacity:.92 !important; }
.fx-clone{ pointer-events:none; }

/* ---------- 卡背資訊 ---------- */
.back__inner.has-fx-info .back__medallion{ width:42%; }
.back__inner.has-fx-info .back__glyph{ font-size:calc(var(--card-w) * .19); }
.back__inner.has-fx-info .back__emblem{ width:78%; }
.back__info{ position:relative; width:82%; display:flex; flex-direction:column; gap:7px; margin-top:2px; padding:8px 10px 9px;
  border-radius:9px; background:rgba(0,0,0,.34); border:1px solid rgba(255,255,255,.12); box-shadow:inset 0 0 14px rgba(0,0,0,.35); }
.bi-head{ display:flex; justify-content:space-between; align-items:baseline; gap:6px;
  font:700 9.5px/1 'Cinzel','Noto Sans TC',serif; letter-spacing:.12em; color:rgba(255,255,255,.6); text-shadow:0 1px 2px #000; }
.bi-head b{ color:var(--fx-c3); font-weight:700; text-shadow:0 0 8px var(--fx-c2), 0 1px 2px #000; }
.bi-stats{ display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; }
.bi-stat{ display:grid; grid-template-columns:24px 1fr 20px; align-items:center; gap:5px;
  font:700 9.5px/1 'Cinzel','Noto Sans TC',serif; letter-spacing:.05em; color:rgba(255,255,255,.78); text-shadow:0 1px 2px #000; }
.bi-stat em{ font-style:normal; color:var(--fx-c3); text-align:right; }
.bi-bar{ height:5px; border-radius:3px; background:rgba(255,255,255,.13); overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.35); }
.bi-bar i{ display:block; height:100%; border-radius:3px; background:linear-gradient(90deg,var(--fx-c1),var(--fx-c2)); box-shadow:0 0 6px var(--fx-c2); }

@media (prefers-reduced-motion: reduce){
  .fx-stars i, .fx-prism{ animation:none !important; }
  .fx-stars i{ opacity:.7; }
}
</style>
<script id="card-fx-js">
/* ====================================================================
   card-fx：稀有度切換 / 技能演出 / 卡背資訊 / WebAudio 合成音效
   由 card-fx/apply_fx.py 注入每張卡片（連同 fx.css、#card-meta）；不要直接改卡片裡的副本。
   對外介面 window.cardFx：
     cast(opts)         技能演出（蓄力 → 爆發）
     cycleRarity(opts)  稀有度往下一階 SR → SSR → UR → LR → SR
     setRarity(r, opts) 直接指定
     toggleMute() / setMuted(bool) / isMuted()
   opts.sound === false 時該次不發聲（多卡合一時只讓一張卡發聲，避免十張疊在一起）。
   桌面掛件外殼（main.js）的全域快捷鍵、系統匣選單就是呼叫這幾個函式。
   單獨用瀏覽器打開時的按鍵：R 稀有度、S 技能、M 靜音；點一下卡片也會施放技能（雙擊＝翻面，不會誤觸）。
   ==================================================================== */
(function () {
  'use strict';
  if (window.cardFx) return;
  var card = document.getElementById('card');
  if (!card) return;
  var stage = document.querySelector('.stage') || document.body;
  var root = document.documentElement;
  var meta = {};
  try { meta = JSON.parse(document.getElementById('card-meta').textContent) || {}; } catch (e) { meta = {}; }

  var TIERS = ['SR', 'SSR', 'UR', 'LR'];
  var PREFIX = 'phantomCardFx:';
  var id = String(meta.id || document.title || 'card');
  function lsGet(k) { try { return localStorage.getItem(PREFIX + k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(PREFIX + k, v); } catch (e) { /* 無痕/被擋：只是不記住 */ } }
  var colors = (meta.colors && meta.colors.length >= 3) ? meta.colors : ['#8be9fd', '#bd93f9', '#ffffff'];
  root.style.setProperty('--fx-c1', colors[0]);
  root.style.setProperty('--fx-c2', colors[1]);
  root.style.setProperty('--fx-c3', colors[2]);

  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ------------------------------------------------------------------ 特效層 */
  var faces = [];
  function makeFace(host) {
    if (!host) return;
    var L = document.createElement('div');
    L.className = 'fx-layer';
    L.innerHTML = '<div class="fx-stars"></div><div class="fx-prism"></div><div class="fx-shine"></div>' +
      '<canvas class="fx-canvas"></canvas><div class="fx-flash"></div><div class="fx-ring"></div><div class="fx-toast"></div>';
    host.appendChild(L);
    var f = {
      host: host, layer: L, cv: L.querySelector('canvas'), stars: L.querySelector('.fx-stars'),
      flash: L.querySelector('.fx-flash'), ring: L.querySelector('.fx-ring'),
      shine: L.querySelector('.fx-shine'), toast: L.querySelector('.fx-toast')
    };
    f.ctx = f.cv.getContext('2d');
    var rnd = mulberry(hash(id) + faces.length * 977);
    for (var i = 0; i < 72; i++) {
      var s = document.createElement('i');
      s.textContent = '✦';
      s.style.left = (rnd() * 96 + 1).toFixed(1) + '%';
      s.style.top = (rnd() * 94 + 2).toFixed(1) + '%';
      s.style.fontSize = (5 + rnd() * 9).toFixed(1) + 'px';
      s.style.setProperty('--d', (2.2 + rnd() * 3.2).toFixed(2) + 's');
      s.style.setProperty('--dl', (-rnd() * 5).toFixed(2) + 's');
      if (rnd() < 0.35) s.style.color = colors[2];
      f.stars.appendChild(s);
    }
    faces.push(f);
  }
  makeFace(card.querySelector('.card__inner'));
  makeFace(card.querySelector('.back__inner'));

  function toast(text) {
    faces.forEach(function (f) {
      f.toast.textContent = text;
      if (f.toast.animate) {
        f.toast.animate([{ opacity: 0, transform: 'translate(-50%,-6px)' }, { opacity: 1, transform: 'translate(-50%,0)', offset: 0.14 },
          { opacity: 1, transform: 'translate(-50%,0)', offset: 0.78 }, { opacity: 0, transform: 'translate(-50%,-4px)' }],
          { duration: 1500, easing: 'ease-out' });
      }
    });
  }

  /* ------------------------------------------------------------------ 音效（WebAudio 合成，不需要任何外部檔案） */
  var AC = window.AudioContext || window.webkitAudioContext;
  var actx = null, master = null, nbuf = null;
  function isMuted() { return lsGet('muted') === '1'; }
  function audio() {
    if (isMuted() || !AC) return null;
    if (!actx) {
      try {
        actx = new AC();
        master = actx.createGain(); master.gain.value = 0.34;
        var comp = actx.createDynamicsCompressor();
        master.connect(comp); comp.connect(actx.destination);
      } catch (e) { actx = null; return null; }
    }
    if (actx.state === 'suspended') { try { actx.resume(); } catch (e) { /* 需要使用者手勢 */ } }
    return actx;
  }
  function noiseBuffer() {
    if (nbuf) return nbuf;
    nbuf = actx.createBuffer(1, actx.sampleRate * 1.2, actx.sampleRate);
    var d = nbuf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return nbuf;
  }
  function tone(freq, t, dur, type, peak, slideTo) {
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + Math.min(0.02, dur / 4));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, ftype, f0, f1, peak, attack) {
    var s = actx.createBufferSource(); s.buffer = noiseBuffer();
    var f = actx.createBiquadFilter(); f.type = ftype;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    f.Q.value = ftype === 'bandpass' ? 1.4 : 0.7;
    var g = actx.createGain(); var a = attack || 0.02;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  var SFX = {
    flip: function (t) { noise(t, 0.3, 'bandpass', 500, 2800, 0.55); tone(190, t, 0.2, 'sine', 0.22, 90); },
    rarity: function (t) {
      var n = { SR: 2, SSR: 3, UR: 4, LR: 5 }[rarity] || 3;
      var sc = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      for (var i = 0; i < n; i++) { tone(sc[i], t + i * 0.075, 0.55, 'triangle', 0.2); tone(sc[i] * 2, t + i * 0.075, 0.4, 'sine', 0.06); }
      noise(t, 0.55, 'highpass', 6000, 9500, 0.05);
    },
    charge: function (t) {
      var o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain(), lfo = actx.createOscillator(), lg = actx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(440, t + 0.75);
      f.type = 'lowpass'; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3200, t + 0.75);
      lfo.frequency.value = 14; lg.gain.value = 0.04; lfo.connect(lg); lg.connect(g.gain);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
      o.connect(f); f.connect(g); g.connect(master);
      o.start(t); lfo.start(t); o.stop(t + 0.85); lfo.stop(t + 0.85);
      noise(t, 0.75, 'lowpass', 200, 4200, 0.16, 0.5);
    },
    burst: function (t) {
      tone(170, t, 0.6, 'sine', 0.7, 36);
      tone(95, t, 0.9, 'sawtooth', 0.16, 48);
      noise(t, 0.5, 'lowpass', 5200, 260, 0.62, 0.008);
      for (var i = 0; i < 9; i++) tone(1800 + Math.random() * 4200, t + 0.03 + Math.random() * 0.4, 0.14, 'sine', 0.07);
    }
  };
  function sfx(name, opts) {
    if (opts && opts.sound === false) return;
    var c = audio(); if (!c) return;
    try { SFX[name](c.currentTime + 0.01); } catch (e) { /* 音效壞了不該影響卡片 */ }
  }

  /* ------------------------------------------------------------------ 稀有度 */
  var rarity = 'SSR';
  function applyRarity(r, opts) {
    if (TIERS.indexOf(r) < 0) r = 'SSR';
    rarity = r;
    document.body.setAttribute('data-rarity', r);
    var chips = document.querySelectorAll('.chip--ssr');
    for (var i = 0; i < chips.length; i++) chips[i].textContent = r;
    var slots = document.querySelectorAll('[data-fx-rarity]');
    for (var j = 0; j < slots.length; j++) slots[j].textContent = r;
    if (opts && opts.save !== false) lsSet(id + ':rarity', r);
    if (opts && opts.fx) {
      faces.forEach(function (f) {
        if (f.shine.animate) f.shine.animate([{ opacity: 0.9, transform: 'translateX(-130%)' }, { opacity: 0.9, transform: 'translateX(130%)' }], { duration: 750, easing: 'ease-in-out' });
      });
      toast('✦ ' + r);
      sfx('rarity', opts);
    }
  }
  function cycleRarity(opts) {
    var o = opts || {};
    applyRarity(TIERS[(TIERS.indexOf(rarity) + 1) % TIERS.length], { fx: true, sound: o.sound });
  }
  var saved = lsGet(id + ':rarity');
  applyRarity(TIERS.indexOf(saved) >= 0 ? saved : (TIERS.indexOf(meta.rarity) >= 0 ? meta.rarity : 'SSR'), { save: false });

  /* ------------------------------------------------------------------ 靜音 */
  function setMuted(m) {
    lsSet('muted', m ? '1' : '0');
    toast(m ? '🔇 音效靜音' : '🔊 音效開啟');
    if (!m) sfx('rarity');
  }
  function toggleMute() { setMuted(!isMuted()); }

  /* ------------------------------------------------------------------ 卡背資訊 */
  (function buildInfo() {
    var back = card.querySelector('.back__inner');
    if (!back || !meta.stats) return;
    var info = document.createElement('div');
    info.className = 'back__info';
    var head = '<div class="bi-head"><span>NO. <b>' + (meta.no || '000') + '</b></span>' +
      '<span>收藏 <b>' + (meta.date || '') + '</b></span></div>';
    var stats = '<div class="bi-stats">';
    ['ATK', 'DEF', 'SPD', 'LUK'].concat(Object.keys(meta.stats)).filter(function (k, i, a) { return a.indexOf(k) === i && meta.stats[k] != null; }).forEach(function (k) {
      var v = clamp(+meta.stats[k] || 0, 0, 100);
      stats += '<div class="bi-stat"><span>' + k + '</span><div class="bi-bar"><i style="width:' + v + '%"></i></div><em>' + v + '</em></div>';
    });
    stats += '</div>';
    var date = '';
    info.innerHTML = head + stats + date;
    var anchor = back.querySelector('.back__id');
    // 六狗系列原本的卡背編號「NO. 03 / 06」是系列內編號，會跟這裡的全系列編號打架 → 改成只顯示名稱
    if (anchor && /NO\.\s*\d+\s*\/\s*\d+/.test(anchor.textContent) && meta.name) anchor.textContent = meta.name;
    if (anchor) back.insertBefore(info, anchor); else back.appendChild(info);
    back.classList.add('has-fx-info');
  })();

  /* ------------------------------------------------------------------ 技能演出 */
  var casting = false;
  var CHARGE = 750, BURST_DUR = 950;
  function cast(opts) {
    if (casting) return;
    casting = true;
    var o = opts || {};
    var sizeBase = faces[0] ? faces[0] : null;
    var W = sizeBase ? sizeBase.host.clientWidth : card.clientWidth;
    var H = sizeBase ? sizeBase.host.clientHeight : card.clientHeight;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    faces.forEach(function (f) {
      f.cv.width = Math.round(W * dpr); f.cv.height = Math.round(H * dpr);
      f.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    });
    var cx = W / 2, cy = H * 0.46;
    var parts = [];
    var cols = [colors[0], colors[1], colors[2], '#ffffff'];
    var t0 = performance.now(), last = t0, burst = false, spawnAcc = 0;
    document.body.classList.add('fx-charging');
    sfx('charge', o);
    toast('⚡ ' + (meta.skillName || 'SKILL'));

    function doBurst() {
      burst = true;
      sfx('burst', o);
      document.body.classList.remove('fx-charging');
      document.body.classList.add('fx-burst');
      parts.length = 0;
      for (var i = 0; i < 130; i++) {
        var a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 9;
        parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.012 + Math.random() * 0.02,
          size: 1.2 + Math.random() * 3, color: cols[i % cols.length], fr: 0.965, mode: 'out' });
      }
      faces.forEach(function (f) {
        if (f.flash.animate) f.flash.animate([{ opacity: 0 }, { opacity: 1, offset: 0.16 }, { opacity: 0 }], { duration: 560, easing: 'ease-out' });
        if (f.ring.animate) {
          f.ring.animate([{ transform: 'translate(-50%,-50%) scale(0)', opacity: 0.95 }, { transform: 'translate(-50%,-50%) scale(30)', opacity: 0 }], { duration: 850, easing: 'cubic-bezier(.1,.7,.2,1)' });
          f.ring.animate([{ transform: 'translate(-50%,-50%) scale(0)', opacity: 0.7 }, { transform: 'translate(-50%,-50%) scale(20)', opacity: 0 }], { duration: 700, delay: 130, easing: 'cubic-bezier(.1,.7,.2,1)', fill: 'backwards' });
        }
      });
      // 殘影加倍：把場景裡的殘影層各複製一份，往兩側飄開再淡出
      var srcs = document.querySelectorAll('.ghost--warn, .ghost--past, .echo');
      Array.prototype.forEach.call(srcs, function (el, k) {
        if (!el.animate || !el.parentNode || el.classList.contains('fx-clone')) return;
        var cl = el.cloneNode(true);
        cl.removeAttribute('id');
        cl.classList.add('fx-clone');
        var base = getComputedStyle(el).transform; if (base === 'none') base = '';
        var dir = k % 2 ? 1 : -1;
        el.parentNode.insertBefore(cl, el.nextSibling);
        var an = cl.animate([
          { transform: base + ' translate(0%,0%) scale(1)', opacity: 0 },
          { transform: base + ' translate(' + (dir * 9) + '%,' + (-4 * dir) + '%) scale(1.06)', opacity: 0.85, offset: 0.25 },
          { transform: base + ' translate(' + (dir * 30) + '%,' + (10 * dir) + '%) scale(1.16)', opacity: 0 }
        ], { duration: 1150, easing: 'ease-out' });
        an.onfinish = function () { if (cl.parentNode) cl.parentNode.removeChild(cl); };
      });
    }

    function frame(now) {
      var dt = Math.min(48, now - last); last = now;
      var t = now - t0, shx = 0, shy = 0, aura = 0, scale = 1;
      if (t < CHARGE) {
        var k = t / CHARGE, e = k * k;
        aura = e; scale = 1 - 0.035 * e;
        var amp = 0.3 + 1.7 * e; shx = (Math.random() - 0.5) * amp; shy = (Math.random() - 0.5) * amp;
        spawnAcc += dt * (0.09 + 0.16 * k);
        while (spawnAcc >= 1) {
          spawnAcc -= 1;
          var a = Math.random() * Math.PI * 2, r = Math.max(W, H) * (0.55 + Math.random() * 0.2);
          parts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * 0.85, life: 1, decay: 0.006, size: 1 + Math.random() * 2.4,
            color: cols[(Math.random() * cols.length) | 0], mode: 'in', sw: (Math.random() - 0.5) * 0.06 });
        }
      } else {
        if (!burst) doBurst();
        var b = clamp((t - CHARGE) / BURST_DUR, 0, 1);
        aura = 1 - b;
        var amp2 = 10 * Math.pow(1 - b, 2); shx = (Math.random() - 0.5) * amp2; shy = (Math.random() - 0.5) * amp2;
        scale = 1 + 0.07 * Math.pow(1 - b, 2) * Math.cos(b * 13);
      }
      root.style.setProperty('--fx-aura', aura.toFixed(3));
      root.style.setProperty('--fx-scale', scale.toFixed(4));
      root.style.setProperty('--fx-shx', shx.toFixed(2) + 'px');
      root.style.setProperty('--fx-shy', shy.toFixed(2) + 'px');

      // 粒子
      for (var i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];
        if (p.mode === 'in') {
          var dx = cx - p.x, dy = cy - p.y;
          p.x += dx * 0.075 - dy * p.sw; p.y += dy * 0.075 + dx * p.sw;
          if (dx * dx + dy * dy < 100) { parts.splice(i, 1); continue; }
        } else {
          p.x += p.vx; p.y += p.vy; p.vx *= p.fr; p.vy *= p.fr; p.life -= p.decay;
          if (p.life <= 0) { parts.splice(i, 1); continue; }
        }
      }
      faces.forEach(function (f) {
        var c = f.ctx;
        c.clearRect(0, 0, W, H);
        c.globalCompositeOperation = 'lighter';
        if (!burst) {                      // 中央能量核心
          var kk = clamp(t / CHARGE, 0, 1), rr = 6 + 46 * kk * kk;
          var gr = c.createRadialGradient(cx, cy, 0, cx, cy, rr);
          gr.addColorStop(0, 'rgba(255,255,255,' + (0.35 + 0.6 * kk) + ')'); gr.addColorStop(0.4, colors[1]); gr.addColorStop(1, 'rgba(0,0,0,0)');
          c.globalAlpha = 0.25 + 0.6 * kk; c.fillStyle = gr; c.beginPath(); c.arc(cx, cy, rr, 0, 6.2832); c.fill();
        }
        for (var j = 0; j < parts.length; j++) {
          var q = parts[j];
          c.globalAlpha = q.mode === 'in' ? 0.85 : clamp(q.life, 0, 1);
          c.fillStyle = q.color;
          c.beginPath(); c.arc(q.x, q.y, q.size * (q.mode === 'in' ? 1 : (0.5 + q.life * 0.7)), 0, 6.2832); c.fill();
        }
        c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
      });

      if (t < CHARGE + BURST_DUR + 250) { requestAnimationFrame(frame); return; }
      // 收尾
      root.style.removeProperty('--fx-aura'); root.style.removeProperty('--fx-scale');
      root.style.removeProperty('--fx-shx'); root.style.removeProperty('--fx-shy');
      document.body.classList.remove('fx-charging', 'fx-burst');
      faces.forEach(function (f) { f.ctx.clearRect(0, 0, W, H); });
      casting = false;
    }
    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ 觸發：點擊 / 按鍵 */
  var down = null, clickTimer = null;
  card.addEventListener('pointerdown', function (e) { if (e.button === 0) down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  window.addEventListener('pointerup', function (e) {
    if (!down) return;
    var d = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
    down = null;
    if (e.button !== 0 || d > 5 || dt > 350) return;          // 拖曳旋轉不算點擊
    clearTimeout(clickTimer);
    clickTimer = setTimeout(function () { cast(); }, 260);    // 等一下：如果是雙擊（翻面）就取消
  });
  card.addEventListener('dblclick', function () { clearTimeout(clickTimer); sfx('flip'); });
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.altKey || e.metaKey || e.repeat) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var k = (e.key || '').toLowerCase();
    if (k === 'r') cycleRarity(); else if (k === 's') cast(); else if (k === 'm') toggleMute();
  });

  window.cardFx = {
    cast: cast, cycleRarity: cycleRarity, setRarity: function (r, o) { applyRarity(r, { fx: true, sound: o && o.sound }); },
    rarity: function () { return rarity; }, toggleMute: toggleMute, setMuted: setMuted, isMuted: isMuted, sfx: sfx, meta: meta,
    audioState: function () { return actx ? actx.state : 'none'; }
  };
})();
</script>
<!--CARD-FX:END-->
</body>
